name: validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OpenAPI 3.1
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator api/openapi.yaml
